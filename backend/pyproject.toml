[project]
name = "conduit-ai-backend"
version = "0.1.0"
description = "ConduitAI — Autonomous OT Isolation & Hardware Diode Workbench Backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.52.0",
    "httpx>=0.27.2",
    "langgraph>=0.2.45",
    "duckdb>=1.1.3",
    "scapy>=2.6.0",
    "pillow>=11.0.0",
    "numpy>=2.1.0",
    "reportlab>=4.2.5",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",
    "modal>=1.0.0",
    "av>=19.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
